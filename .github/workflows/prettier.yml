name: Check Format
on:
  push:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check Format
        run: npm run check-format
      - name: Show formatter diff on failure (local runner only)
        if: failure()
        run: |
          if test -x node_modules/.bin/prettier; then
            npm exec --no -- prettier --write scripts/import-writing-handoff.js tests/import-writing-handoff.test.js
            git diff -- scripts/import-writing-handoff.js tests/import-writing-handoff.test.js
          fi
